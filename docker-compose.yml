services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:${SERVICE_VERSION:-latest}
    container_name: freellmapi
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    volumes:
      - ./data:/app/server/data

  # Only published port. Proxies to freellmapi and lets the ServiceHub origin frame the dashboard.
  freellmapi_proxy:
    image: nginx:1.27-alpine
    container_name: freellmapi_proxy
    restart: unless-stopped
    depends_on:
      - freellmapi
    environment:
      SERVICE_FRAME_ANCESTORS: ${SERVICE_FRAME_ANCESTORS:-http://scutiserver1.local:29880}
    ports:
      - "${SERVICE_PORT:-29652}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
